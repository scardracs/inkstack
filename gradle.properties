## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

android.enableJetifier=false
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official

# Parallel project execution + local/remote build cache (task outputs).
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: reuse the task graph across runs. Problems are warnings so
# a new AGP/plugin incompatibility does not hard-fail the build.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Machine has 32 GB RAM / many cores; keep headroom for the Kotlin daemon + AGP.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
# Cap workers so daemon + KSP + R8 do not thrash together (32 logical CPUs).
org.gradle.workers.max=8

android.enableR8.fullMode=true
# Required by AGP 9 optimized resource shrinking (R8).
android.nonFinalResIds=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
