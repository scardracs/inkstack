## Build environment — see https://docs.gradle.org/current/userguide/build_environment.html
##
## Intentionally omitted (already AGP 8+/9 defaults, no need to restate):
##   android.useAndroidX=true
##   android.enableJetifier=false
##   android.nonTransitiveRClass=true
##   android.nonFinalResIds=true
##   android.enableR8.fullMode=true

# IDE / Kotlin formatting convention (does not affect compile speed).
kotlin.code.style=official

# Gradle 9 preferred execution mode + speed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Soften CC incompatibilities during plugin bumps; switch to fail (omit this) once clean.
org.gradle.configuration-cache.problems=warn

# Daemon heap for this machine (32 GB). Omit HeapDumpOnOutOfMemoryError unless debugging OOMs
# (dumps are large). Leave workers uncapped — Gradle defaults to available processors.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
