name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Android + Gradle
        uses: ./.github/actions/setup-android

      - name: Assemble debug + unit tests
        # One Gradle invocation: shared configuration / daemon / build cache.
        # Parsers live network suite stays local (:parsers:testLiveSources).
        run: >
          ./gradlew
          :app:assembleDebug
          :parsers:test
          :app:testDebugUnitTest
          --stacktrace

  release:
    name: Assemble release (signed when secrets present)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Android + Gradle
        uses: ./.github/actions/setup-android

      - name: Require signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "${RELEASE_STORE_FILE_BASE64}" ]; then
            echo "::error::Tagged releases require RELEASE_STORE_FILE_BASE64 and related signing secrets."
            exit 1
          fi

      - name: Decode release keystore
        if: env.RELEASE_STORE_FILE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_STORE_FILE_BASE64" | base64 -d > keystore/inkstack-release.jks

      - name: Assemble release
        env:
          RELEASE_STORE_FILE: keystore/inkstack-release.jks
        run: |
          # Skip lintVital here — it parallelizes poorly with R8 on CI runners and
          # duplicates work already covered by local/IDE lint. Save ~1m wall clock.
          ARGS=(:app:assembleRelease -x lintVitalRelease --stacktrace)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            ARGS+=("-PversionName=${NAME}")
          fi
          ./gradlew "${ARGS[@]}"

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            Full notes: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          generate_release_notes: true
          fail_on_unmatched_files: true
