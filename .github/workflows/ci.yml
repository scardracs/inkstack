name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          # Pre-accept common SDK licenses (non-interactive CI)
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf 'd56f5187479451bebfb76e3538eab2e3\n' > "$ANDROID_HOME/licenses/android-googletv-license"
          printf '33b6a2b64607f11b759f320ef9dff4ae\n' > "$ANDROID_HOME/licenses/google-gdk-license"
          # Prefer android-37; fall back to 36 if the package is not published yet
          android --no-metrics --sdk="$ANDROID_HOME" sdk install \
            platform-tools \
            platforms/android-37 \
            platforms/android-36 \
            build-tools/36.0.0 \
            || android --no-metrics --sdk="$ANDROID_HOME" sdk install \
              platform-tools \
              platforms/android-36 \
              build-tools/36.0.0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; avoid default enhanced (proprietary Terms of Use)
          cache-provider: basic

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Parsers unit tests
        # Excludes MangaParserTest (live network suite). Run locally via :parsers:testLiveSources
        run: ./gradlew :parsers:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  release:
    name: Assemble release (signed when secrets present)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "27"

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf 'd56f5187479451bebfb76e3538eab2e3\n' > "$ANDROID_HOME/licenses/android-googletv-license"
          printf '33b6a2b64607f11b759f320ef9dff4ae\n' > "$ANDROID_HOME/licenses/google-gdk-license"
          android --no-metrics --sdk="$ANDROID_HOME" sdk install \
            platform-tools \
            platforms/android-37 \
            platforms/android-36 \
            build-tools/36.0.0 \
            || android --no-metrics --sdk="$ANDROID_HOME" sdk install \
              platform-tools \
              platforms/android-36 \
              build-tools/36.0.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Require signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "${RELEASE_STORE_FILE_BASE64}" ]; then
            echo "::error::Tagged releases require RELEASE_STORE_FILE_BASE64 and related signing secrets."
            exit 1
          fi

      - name: Decode release keystore
        if: env.RELEASE_STORE_FILE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_STORE_FILE_BASE64" | base64 -d > keystore/inkstack-release.jks

      - name: Assemble release
        env:
          RELEASE_STORE_FILE: keystore/inkstack-release.jks
        run: |
          ARGS=(:app:assembleRelease --stacktrace)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            ARGS+=("-PversionName=${NAME}")
          fi
          ./gradlew "${ARGS[@]}"

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            Full notes: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          generate_release_notes: true
          fail_on_unmatched_files: true