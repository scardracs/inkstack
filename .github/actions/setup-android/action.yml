name: Setup Android + Gradle
description: JDK, cached Android SDK, Gradle wrapper cache

inputs:
  java-version:
    description: Temurin JDK major version
    required: false
    default: "27"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Cache Android SDK
      id: android-sdk
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_HOME }}
        # Bump the suffix when platforms / build-tools change.
        key: android-sdk-${{ runner.os }}-api37-api36-bt36.0.0-v1

    - name: Install Android CLI
      if: steps.android-sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install Android SDK packages
      if: steps.android-sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$ANDROID_HOME/licenses"
        printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
        printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        printf 'd56f5187479451bebfb76e3538eab2e3\n' > "$ANDROID_HOME/licenses/android-googletv-license"
        printf '33b6a2b64607f11b759f320ef9dff4ae\n' > "$ANDROID_HOME/licenses/google-gdk-license"
        android --no-metrics --sdk="$ANDROID_HOME" sdk install \
          platform-tools \
          platforms/android-37 \
          platforms/android-36 \
          build-tools/36.0.0 \
          || android --no-metrics --sdk="$ANDROID_HOME" sdk install \
            platform-tools \
            platforms/android-36 \
            build-tools/36.0.0

    - name: Ensure platform-tools on PATH
      if: steps.android-sdk.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        # CLI may still be useful for sdk updates; ignore if absent.
        if [ -x "$HOME/.local/bin/android" ]; then
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
        # Keep the daemon across steps in the same job (assemble + tests).
        cache-read-only: false
